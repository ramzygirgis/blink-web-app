<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blink Reminder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="logo">
          <img id="logo-img" src="/dark-logo.png" alt="Blink" />
        </div>

        <nav id="nav-menu">
          <button class="nav-button" data-view="monitor" type="button" aria-current="true">Monitor</button>
          <button class="nav-button" data-view="settings" type="button">Settings</button>
        </nav>
      </aside>

      <main id="main-content">
      <section id="view-monitor" class="view">
        <button id="start-button" type="button">Start monitoring</button>
        <p id="status">Click "Start monitoring" to begin.</p>

        <div id="stats-row">
          <div class="stat-tile">
            <span class="stat-label">Blinks</span>
            <span class="stat-value" id="blink-count-value">0</span>
          </div>
          <div class="stat-tile">
            <span class="stat-label">Time since last blink</span>
            <span class="stat-value" id="time-since-blink-value">0.0s</span>
          </div>
        </div>

        <video id="camera-feed" autoplay playsinline muted></video>

        <div id="blendshapes">
          <div class="blink-meter">
            <label for="blink-left">Left eye blink</label>
            <progress id="blink-left" max="1" value="0"></progress>
            <span id="blink-left-value">0.00</span>
          </div>
          <div class="blink-meter">
            <label for="blink-right">Right eye blink</label>
            <progress id="blink-right" max="1" value="0"></progress>
            <span id="blink-right-value">0.00</span>
          </div>
          <div class="blink-meter">
            <label for="blink-combined">Combined (min)</label>
            <progress id="blink-combined" max="1" value="0"></progress>
            <span id="blink-combined-value">0.00</span>
          </div>
        </div>
      </section>

      <section id="view-settings" class="view" hidden>
        <div class="settings-group">
          <h2>Blink Parameters</h2>
          <div class="setting-row">
            <label for="setting-enter-threshold">Blink threshold (enter closed)</label>
            <input type="range" id="setting-enter-threshold" min="0.6" max="0.8" step="0.01" value="0.70" />
            <span id="setting-enter-threshold-value">0.70</span>
          </div>
          <div class="setting-row">
            <label for="setting-min-duration">Minimum blink duration (ms)</label>
            <input type="range" id="setting-min-duration" min="0" max="300" step="10" value="50" />
            <span id="setting-min-duration-value">50</span>
          </div>
          <div class="setting-row setting-toggle">
            <label for="setting-show-camera">Show camera preview</label>
            <input type="checkbox" id="setting-show-camera" checked />
          </div>
        </div>

        <div class="settings-group">
          <h2>Alerts</h2>
          <div class="setting-row">
            <label for="setting-alert-delay">Alert delay (s)</label>
            <input type="range" id="setting-alert-delay" min="3" max="15" step="1" value="8" />
            <span id="setting-alert-delay-value">8</span>
          </div>
          <div class="setting-row">
            <label for="setting-volume">Alert volume</label>
            <input type="range" id="setting-volume" min="0" max="1" step="0.05" value="1" />
            <span id="setting-volume-value">100%</span>
          </div>
        </div>

        <button id="reset-defaults-button" type="button">Reset to defaults</button>
      </section>
      </main>

      <dialog id="reset-confirm-dialog">
        <p>Reset all settings to their defaults?</p>
        <div class="dialog-actions">
          <button id="reset-cancel-button" type="button">Cancel</button>
          <button id="reset-confirm-button" type="button" class="danger">Reset</button>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
