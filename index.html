<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/blink-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="200" height="72" viewBox="0 0 200 72" role="img" aria-label="Blink logo">
            <defs>
              <style>
                @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&amp;display=swap');
                .wordmark { font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 500; letter-spacing: -0.5px; fill: #FFFFFF; }
              </style>
            </defs>
            <circle cx="36" cy="36" r="34" fill="#FFFFFF"/>
            <path d="M20 28 Q28 21 36 28 Q44 35 52 28" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>
            <rect x="20" y="37" width="32" height="5" rx="2.5" fill="#2B2B2B"/>
            <rect x="20" y="46" width="32" height="5" rx="2.5" fill="#2B2B2B"/>
            <text x="82" y="48" class="wordmark">blink</text>
          </svg>
        </div>

        <nav id="nav-menu">
          <button class="nav-button" data-view="monitor" type="button" aria-current="true">Monitor</button>
          <button class="nav-button" data-view="settings" type="button">Settings</button>
        </nav>
      </aside>

      <main id="main-content">
      <section id="view-monitor" class="view">
        <button id="start-button" type="button">Start monitoring</button>
        <p id="status">Click "Start monitoring" to begin.</p>

        <div id="stats-row">
          <div class="stat-tile">
            <span class="stat-label">Blinks</span>
            <span class="stat-value" id="blink-count-value">0</span>
          </div>
          <div class="stat-tile">
            <span class="stat-label">Time since last blink</span>
            <span class="stat-value" id="time-since-blink-value">0.0s</span>
          </div>
        </div>

        <video id="camera-feed" autoplay playsinline muted></video>

        <div id="blendshapes">
          <div class="blink-meter">
            <label for="blink-probability">Blink probability</label>
            <progress id="blink-probability" max="1" value="0"></progress>
            <span id="blink-probability-value">0.00</span>
          </div>
        </div>
      </section>

      <section id="view-settings" class="view" hidden>
        <div class="settings-group">
          <h2>Blink Parameters</h2>
          <div class="setting-row setting-row-wide-value">
            <label for="setting-sensitivity">Blink sensitivity</label>
            <input type="range" id="setting-sensitivity" min="0" max="100" step="1" value="50" />
            <span id="setting-sensitivity-value">Mid</span>
          </div>
          <div class="setting-row">
            <label for="setting-min-duration">Minimum blink duration (ms)</label>
            <input type="range" id="setting-min-duration" min="0" max="300" step="10" value="50" />
            <span id="setting-min-duration-value">50</span>
          </div>
          <div class="setting-row setting-toggle">
            <label for="setting-show-camera">Show camera preview</label>
            <input type="checkbox" id="setting-show-camera" checked />
          </div>
        </div>

        <div class="settings-group">
          <h2>Alerts</h2>
          <div class="setting-row">
            <label for="setting-alert-delay">Alert delay (s)</label>
            <input type="range" id="setting-alert-delay" min="3" max="15" step="1" value="8" />
            <span id="setting-alert-delay-value">8</span>
          </div>
          <div class="setting-row">
            <label for="setting-volume">Alert volume</label>
            <input type="range" id="setting-volume" min="0" max="1" step="0.05" value="1" />
            <span id="setting-volume-value">100%</span>
          </div>
        </div>

        <button id="reset-defaults-button" type="button">Reset to defaults</button>
      </section>
      </main>

      <dialog id="reset-confirm-dialog">
        <p>Reset all settings to their defaults?</p>
        <div class="dialog-actions">
          <button id="reset-cancel-button" type="button">Cancel</button>
          <button id="reset-confirm-button" type="button" class="danger">Reset</button>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
